name: Build Pulizia S24 APK

on:
  push:
    paths:
      - 's24-cleaner/**'
      - '.github/workflows/s24-cleaner-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s24-cleaner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PuliziaS24-apk
          path: s24-cleaner/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
